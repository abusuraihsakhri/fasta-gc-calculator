name: Fasta Gc Calculator CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "fastapi>=0.110,<1" "uvicorn>=0.30,<1" "pydantic>=2,<3" pytest

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Compile Python sources and check dependencies
      run: |
        python -m compileall -q .
        python -m pip check

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Verify browser calculator
      run: |
        node --test web/calculator.test.mjs
        python - <<'PY'
        from pathlib import Path
        import re
        import subprocess
        import tempfile

        for path in (Path("index.html"), Path("web/index.html")):
            html = path.read_text(encoding="utf-8")
            scripts = re.findall(r'<script type="module">([\\s\\S]*?)</script>', html)
            assert len(scripts) == 1, f"Missing inline application script: {path}"
            assert "calulator.mjs" not in html
            with tempfile.TemporaryDirectory() as directory:
                script = Path(directory) / "inline.mjs"
                script.write_text(scripts[0], encoding="utf-8")
                subprocess.run(["node", "--check", str(script)], check=True)
        PY

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "

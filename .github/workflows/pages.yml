name: Publish FASTA Calculator to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p site/web
          cp index.html site/index.html
          cp web/index.html web/calculator.mjs site/web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed HTML and JavaScript
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 -o /tmp/fasta-site.html "$PAGE_URL"
          grep -q "FASTA GC Calculator" /tmp/fasta-site.html
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 -o /tmp/fasta-calculator.mjs "${PAGE_URL%/}/web/calculator.mjs"
          grep -q "export function parseFasta" /tmp/fasta-calculator.mjs

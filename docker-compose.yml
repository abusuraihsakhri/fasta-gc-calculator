services:
  fasta-gc-calculator:
    build: .
    ports:
      - "8000:8000"
    entrypoint: ["uvicorn", "agents.api:app", "--host", "0.0.0.0", "--port", "8000"]
    command: []
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:-}
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
